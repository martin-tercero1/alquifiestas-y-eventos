    <linearGradient id="flare" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff4d8" stop-opacity="0.72"/>
      <stop offset="46%" stop-color="#fff4d8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="46%" r="72%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.42"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="1080" fill="#b3a68e"/>
  <rect y="725" width="1080" height="355" fill="#9c8f7c"/>
  <g filter="url(#soft)"><rect x="388" y="477" width="127" height="356" rx="5" fill="#8fa38c" opacity="0.82"/><rect x="36" y="647" width="269" height="128" rx="11" fill="#c4b79f" opacity="0.82"/><rect x="-40" y="550" width="256" height="269" rx="10" fill="#7d8f7a" opacity="0.84"/><rect x="244" y="526" width="343" height="256" rx="14" fill="#8fa38c" opacity="0.82"/><rect x="414" y="542" width="253" height="171" rx="10" fill="#c4b79f" opacity="0.75"/><rect x="117" y="563" width="122" height="144" rx="5" fill="#a89a83" opacity="0.50"/><rect x="511" y="344" width="208" height="333" rx="8" fill="#c4b79f" opacity="0.85"/></g>

  <g >
    <ellipse cx="590" cy="640" rx="252" ry="44" fill="#000" opacity="0.26"/>
    
    <circle cx="590.0774760939181" cy="434.9056796642366" r="161.41735972577044" fill="none" stroke="#c9c3b6" stroke-width="21.858600796198083"/>
    <rect x="479.10304128245093" y="589.5973160680999" width="221.94886962293438" height="18.49573913524453" rx="8.407154152383878" fill="#c9c3b6"/>
  </g>

  <rect width="1080" height="1080" fill="url(#flare)"/>
