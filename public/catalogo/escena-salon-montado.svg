<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="presentation">
  <defs>
    <filter id="soft"><feGaussianBlur stdDeviation="2.12"/></filter>
    
    <filter id="noise">
