  <g >
    <ellipse cx="435" cy="537" rx="152" ry="26" fill="#000" opacity="0.26"/>
    
    <ellipse cx="435.16495058536526" cy="407.4810806234278" rx="105.21030242540422" ry="30.349125699635835" fill="#e2ded4"/>
    <rect x="329.95464815996104" y="405.45780557678535" width="210.42060485080845" height="14.162925326496723" fill="#e2ded4"/>
    <rect x="426.0602128754745" y="417.5974558566397" width="18.2094754197815" height="87.00082700562272" fill="#e2ded4" opacity="0.85"/>
    <ellipse cx="435.16495058536526" cy="504.5982828622624" rx="46.53532607277495" ry="12.139650279854333" fill="#e2ded4" opacity="0.8"/>
