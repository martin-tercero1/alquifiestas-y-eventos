      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <linearGradient id="flare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe9c4" stop-opacity="0.5"/>
      <stop offset="46%" stop-color="#ffe9c4" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="46%" r="72%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.42"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="1080" fill="#8d9086"/>
  <rect y="720" width="1080" height="360" fill="#63655c"/>
  <g filter="url(#soft)"><rect x="-66" y="438" width="294" height="328" rx="12" fill="#9a9c90" opacity="0.69"/><rect x="428" y="477" width="199" height="290" rx="8" fill="#9a9c90" opacity="0.89"/><rect x="786" y="346" width="339" height="364" rx="14" fill="#84867a" opacity="0.81"/><rect x="777" y="624" width="129" height="138" rx="5" fill="#565952" opacity="0.63"/><rect x="696" y="455" width="273" height="247" rx="11" fill="#565952" opacity="0.54"/><rect x="367" y="614" width="149" height="178" rx="6" fill="#75776d" opacity="0.56"/><rect x="364" y="410" width="140" height="399" rx="6" fill="#75776d" opacity="0.81"/><rect x="516" y="562" width="149" height="231" rx="6" fill="#84867a" opacity="0.56"/></g>

  <g >
    <ellipse cx="398" cy="774" rx="281" ry="49" fill="#000" opacity="0.26"/>
    
    <circle cx="398.0031161852181" cy="545.4086164645129" r="179.55842592946942" fill="none" stroke="#9a9a94" stroke-width="24.31520351128232"/>
    <rect x="274.5566983587079" y="717.4854413135878" width="246.89283565302048" height="20.57440297108504" rx="9.3520013504932" fill="#9a9a94"/>
  </g>

  <rect width="1080" height="1080" fill="url(#flare)"/>
