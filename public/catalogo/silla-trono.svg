    <linearGradient id="flare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4d8" stop-opacity="0.72"/>
      <stop offset="46%" stop-color="#fff4d8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="46%" r="72%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.42"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="768" fill="#b3a68e"/>
  <rect y="487" width="1024" height="281" fill="#9c8f7c"/>
  <g filter="url(#soft)"><rect x="419" y="191" width="216" height="260" rx="9" fill="#7d8f7a" opacity="0.74"/><rect x="845" y="311" width="212" height="160" rx="8" fill="#a89a83" opacity="0.72"/><rect x="266" y="338" width="112" height="149" rx="4" fill="#a89a83" opacity="0.82"/><rect x="219" y="405" width="145" height="114" rx="6" fill="#7d8f7a" opacity="0.56"/><rect x="153" y="312" width="241" height="284" rx="10" fill="#7d8f7a" opacity="0.63"/></g>

  <g >
    <ellipse cx="337" cy="601" rx="188" ry="33" fill="#000" opacity="0.26"/>
    
    <circle cx="337.4727905082703" cy="448.1789857866976" r="120.31409483555827" fill="none" stroke="#e2ded4" stroke-width="16.292533675648514"/>
    <rect x="254.75685030882397" y="563.4799933374409" width="165.43188039889262" height="13.78599003324105" rx="6.26635910601866" fill="#e2ded4"/>
  </g>

  <rect width="1024" height="768" fill="url(#flare)"/>
  <rect width="1024" height="768" fill="url(#vig)"/>
  <rect width="1024" height="768" filter="url(#noise)" opacity="0.16" style="mix-blend-mode:overlay"/>
