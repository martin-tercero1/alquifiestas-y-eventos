<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="presentation">
  <defs>
    <filter id="soft"><feGaussianBlur stdDeviation="2.65"/></filter>
    <filter id="shake"><feGaussianBlur stdDeviation="3.96 0.4"/></filter>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <linearGradient id="flare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffdfae" stop-opacity="0.4"/>
      <stop offset="46%" stop-color="#ffdfae" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="46%" r="72%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.42"/>
    </radialGradient>
  </defs>

  <rect width="900" height="1200" fill="#6f7b83"/>
  <rect y="802" width="900" height="398" fill="#575f66"/>
  <g filter="url(#soft)"><rect x="621" y="649" width="202" height="161" rx="8" fill="#68737a" opacity="0.78"/><rect x="-54" y="723" width="218" height="122" rx="9" fill="#7e8a91" opacity="0.77"/><rect x="54" y="720" width="91" height="149" rx="4" fill="#7e8a91" opacity="0.86"/><rect x="412" y="627" width="174" height="220" rx="7" fill="#5b666d" opacity="0.60"/><rect x="-59" y="296" width="267" height="475" rx="11" fill="#68737a" opacity="0.69"/><rect x="533" y="501" width="247" height="341" rx="10" fill="#8b959b" opacity="0.69"/><rect x="445" y="563" width="91" height="296" rx="4" fill="#7e8a91" opacity="0.65"/><rect x="752" y="460" width="120" height="327" rx="5" fill="#7e8a91" opacity="0.63"/></g>

  <g filter="url(#shake)">
    <ellipse cx="338" cy="777" rx="251" ry="43" fill="#000" opacity="0.26"/>
    
    <circle cx="337.8818776477128" cy="572.9842337885975" r="160.5235985655698" fill="none" stroke="#b3934e" stroke-width="21.73757063908758"/>
    <rect x="227.5219036338836" y="726.819349080602" width="220.7199480276585" height="18.393329002304874" rx="8.36060409195676" fill="#b3934e"/>
  </g>

  <rect width="900" height="1200" fill="url(#flare)"/>
  <rect width="900" height="1200" fill="url(#vig)"/>
  <rect width="900" height="1200" filter="url(#noise)" opacity="0.16" style="mix-blend-mode:overlay"/>
</svg>