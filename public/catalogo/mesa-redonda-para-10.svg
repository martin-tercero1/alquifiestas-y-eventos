  <g filter="url(#shake)">
    <ellipse cx="512" cy="480" rx="210" ry="36" fill="#000" opacity="0.26"/>
    
    <ellipse cx="511.56338232040406" cy="300.1984459277122" rx="145.89094321350896" ry="42.08392592697374" fill="#c9c3b6"/>
    <rect x="365.6724391068951" y="297.39285086591394" width="291.7818864270179" height="19.639165432587745" fill="#c9c3b6"/>
    <rect x="498.93820454231195" y="314.22642123670346" width="25.250355556184246" height="120.64058765732473" fill="#c9c3b6" opacity="0.85"/>
    <ellipse cx="511.56338232040406" cy="434.8670088940282" rx="64.52868642135974" ry="16.833570370789495" fill="#c9c3b6" opacity="0.8"/>
  </g>

  <rect width="1024" height="768" fill="url(#flare)"/>
