<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768" role="presentation">
  <defs>
    <filter id="soft"><feGaussianBlur stdDeviation="2.26"/></filter>
    <filter id="shake"><feGaussianBlur stdDeviation="3.37 0.4"/></filter>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
