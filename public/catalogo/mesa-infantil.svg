<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="presentation">
  <defs>
    <filter id="soft"><feGaussianBlur stdDeviation="2.65"/></filter>
    
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <linearGradient id="flare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffc978" stop-opacity="0.85"/>
      <stop offset="46%" stop-color="#ffc978" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="46%" r="72%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.42"/>
    </radialGradient>
  </defs>

  <rect width="900" height="1200" fill="#333a3c"/>
  <rect y="701" width="900" height="499" fill="#272c2e"/>
  <g filter="url(#soft)"><rect x="150" y="517" width="282" height="227" rx="11" fill="#2e3436" opacity="0.87"/><rect x="200" y="402" width="128" height="455" rx="5" fill="#454e51" opacity="0.88"/><rect x="692" y="523" width="199" height="233" rx="8" fill="#454e51" opacity="0.71"/><rect x="625" y="552" width="116" height="173" rx="5" fill="#454e51" opacity="0.75"/><rect x="262" y="472" width="221" height="318" rx="9" fill="#4a5356" opacity="0.87"/><rect x="649" y="393" width="78" height="290" rx="3" fill="#3f474a" opacity="0.89"/></g>

  <g >
    <ellipse cx="578" cy="750" rx="201" ry="35" fill="#000" opacity="0.26"/>
    
    <ellipse cx="577.6375368162991" cy="578.3441956069831" rx="139.42479069361224" ry="40.218689623157374" fill="#dcd8ce"/>
    <rect x="438.21274612268684" y="575.662949632106" width="278.8495813872245" height="18.76872182414011" fill="#dcd8ce"/>
    <rect x="565.5719299293519" y="591.7504254813689" width="24.131213773894423" height="115.29357691971781" fill="#dcd8ce" opacity="0.85"/>
    <ellipse cx="577.6375368162991" cy="707.0440024010867" rx="61.66865742217464" ry="16.08747584926295" fill="#dcd8ce" opacity="0.8"/>
  </g>

  <rect width="900" height="1200" fill="url(#flare)"/>
  <rect width="900" height="1200" fill="url(#vig)"/>
